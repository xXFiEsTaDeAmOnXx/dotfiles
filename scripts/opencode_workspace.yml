services:
  opencode:
    image: opencode_sandbox
    build:
      context: .
      dockerfile: Dockerfile.opencode
      args:
        USERNAME: niklas
        USER_UID: 1000
        USER_GID: 1000
    volumes:
      - $PWD:/home/niklas/workspace
      - ~/.config/opencode:/home/niklas/.config/opencode
      - ~/.local/share/opencode:/home/niklas/.local/share/opencode
    command: tail -f /dev/null

---
services:
  robocup_workspace:
    image: robocup_workspace
    build:
      context: .
      dockerfile: Dockerfile_Workspace
      args:
        BASE_IMAGE: fbe-dockerreg.rwu.de/prj-iki-ros2/robots/tiago/tiago_base:base
    environment:
      ROS_DOMAIN_ID: $ROS_DOMAIN_ID
      DISPLAY: $DISPLAY
      QT_X11_NO_MITSHM: '1'
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility,graphics
    privileged: true
    network_mode: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $HOME/.Xauthority:/root/.Xauthority
      - ros2_robocup_ws_dev_home:/home/niklas
      - $PWD:/home/niklas/ros2_ws/src
    runtime: nvidia
    command: tail -f /dev/null
volumes:
    ros2_robocup_ws_dev_home:  
